name: Cluster Builder
version: 0.2.1
slug: cluster_builder
description: Build a three-node Proxmox cluster for Home Assistant over the network (or one USB stick), no command line.
url: https://github.com/brentb2529/cluster-builder
arch:
  - aarch64
  - amd64
init: false
startup: services
hassio_api: true
hassio_role: backup
map:
  - type: share
    read_only: false
homeassistant_api: true
ingress: true
panel_icon: mdi:server-network
panel_title: Cluster Builder
host_network: true  # answers the machines' network-boot broadcasts (UDP 67/4011) and serves TFTP (69) and :8808
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
