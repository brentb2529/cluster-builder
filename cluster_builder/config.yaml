name: Cluster Builder
version: 0.1.2
slug: cluster_builder
description: Build a three-node Proxmox cluster for Home Assistant from one USB stick, no command line.
url: https://github.com/brentb2529/cluster-builder
arch:
  - aarch64
  - amd64
init: false
startup: services
hassio_api: true
hassio_role: backup
map:
  - type: share
    read_only: false
homeassistant_api: true
ingress: true
panel_icon: mdi:server-network
panel_title: Cluster Builder
ports:
  8808/tcp: 8808
ports_description:
  8808/tcp: Where the new machines fetch their install answers and report progress (keep it at 8808)
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
